apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: surges-entry
type: Opaque
stringData:
  # ==============================================================================
  # SurgesEntry Kubernetes Secrets Template
  # In local demo: copy this file to k8s/secret.yaml and supply your credentials.
  # In production: inject via HashiCorp Vault, AWS Secrets Manager, or External Secrets Operator.
  # DO NOT commit real credentials or secret.yaml to version control.
  # ==============================================================================
  POSTGRES_DSN: "postgres://<DB_USER>:<DB_PASSWORD>@<DB_HOST>:5432/<DB_NAME>?sslmode=disable"
