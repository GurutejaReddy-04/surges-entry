apiVersion: apps/v1
kind: Deployment
metadata:
  name: surges-entry-ingestion
  namespace: surges-entry
  labels:
    app: surges-entry-ingestion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: surges-entry-ingestion
  template:
    metadata:
      labels:
        app: surges-entry-ingestion
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: surges-entry-ingestion
          image: surges-entry/ingestion:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: health
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: platform-config
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
      volumes:
        - name: tmp-dir
          emptyDir: {}
