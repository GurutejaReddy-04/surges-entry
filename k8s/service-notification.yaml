apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: event-platform
  labels:
    app: notification-service
spec:
  type: ClusterIP
  selector:
    app: notification-service
  ports:
    - name: grpc
      port: 50052
      targetPort: 50052
    - name: health
      port: 8080
      targetPort: 8080
